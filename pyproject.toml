[project]
name = "guardrail-contract-lab"
version = "0.1.0"
description = "Prove a guardrail does what its config says: rules that run in every runtime, coverage in every language, and a failure contract that holds."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
gcl = "gcl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gcl"]

[tool.hatch.build.targets.wheel.force-include]
# The demo's fixtures ship inside the package so `gcl demo` works from an installed wheel.
"examples" = "gcl/_examples"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "ISC", "RUF", "SIM", "PERF"]
# B008: typer declares options as call defaults by design.
ignore = ["B008", "RUF001", "RUF002", "RUF003", "PERF401"]
